on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Aceptar licencias de Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Crear google-services.json desde Secret
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Compilar APK Debug
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: ControlAcceso-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar APK en Release (al crear un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
